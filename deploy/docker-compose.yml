# Analytics stack: Beszel hub + agent, SvelteKit frontend.
# Tailnet ingress is provided by aserver's nginx (see deploy/nginx/snippets/
# and the README's "On aserver" section). The frontend is published on
# ${BSERVER_LAN_IP}:${ANALYTICS_HOST_PORT} so aserver can reverse-proxy over
# the LAN.

services:
  beszel-hub:
    image: henrygd/beszel:${BESZEL_VERSION}
    restart: unless-stopped
    # Published on:
    #  - ${BSERVER_LAN_IP}:8090 so aserver's nginx can reach /_/ and /api/
    #    over the LAN for the public analytics.<your-domain> URL.
    #  - ${BSERVER_TS_IP}:8090  so any tailnet client can reach Beszel's
    #    bundled admin UI directly (the only place to add new systems —
    #    the custom SvelteKit dashboard doesn't include that form).
    ports:
      - "${BSERVER_LAN_IP:?BSERVER_LAN_IP must be set in .env}:8090:8090"
      - "${BSERVER_TS_IP:?BSERVER_TS_IP must be set in .env}:8090:8090"
    volumes:
      - hub-data:/beszel_data
    networks:
      - internal

  beszel-agent:
    image: henrygd/beszel-agent:${BESZEL_VERSION}
    restart: unless-stopped
    # pid:host + network_mode:host so the agent sees real host-level process
    # and network metrics instead of the container's namespaced view.
    pid: host
    network_mode: host
    volumes:
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Agent runs in network_mode: host, so localhost is bserver's loopback.
      # The hub publishes only on ${BSERVER_LAN_IP}:8090, so reach it there.
      HUB_URL: "http://${BSERVER_LAN_IP}:8090"
      KEY: "${BESZEL_AGENT_KEY}"

  frontend:
    build:
      context: ../app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BSERVER_LAN_IP:?BSERVER_LAN_IP must be set in .env}:${ANALYTICS_HOST_PORT:?ANALYTICS_HOST_PORT must be set in .env}:3000"
    environment:
      PUBLIC_BESZEL_URL: "${PUBLIC_BESZEL_URL}"
      BESZEL_API_TOKEN: "${BESZEL_API_TOKEN}"
    networks:
      - internal
    depends_on:
      - beszel-hub

networks:
  internal:

volumes:
  hub-data:
