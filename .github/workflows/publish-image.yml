# Builds the analytics frontend image on GitHub's runners and publishes it to
# ghcr.io.
#
# bserver no longer builds anything: it pulls the image this workflow pushes.
# Runners are x86_64, which is what bserver is — so the image is correct no
# matter which machine the commit came from (a MacBook on Apple Silicon would
# otherwise produce an arm64 image bserver cannot start).
#
# Only one service in the stack is ours. `beszel-hub` runs the third-party
# henrygd/beszel image and already pulls, so it needs no job here.
#
# Image name is spelled lowercase on purpose. ghcr.io rejects uppercase paths,
# and `github.repository` is `AbstractNucleus/analytics`.

name: publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push to main should win outright rather than race the first.
concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/abstractnucleus/analytics
          # sha-<short> is the rollback handle; latest is the convenience tag.
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          # The frontend's build context is app/, not the repo root — same as
          # `context: ../app` in the compose files. app/.dockerignore applies.
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `pnpm install` is the slow layer; keep it across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy on bserver with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "cd /home/abstract/deploy/analytics && docker compose pull && docker compose up -d --wait" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
